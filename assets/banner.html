<!doctype html>
<!-- Fuente del banner del README. Exportar con:
     brave --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,420 --screenshot=assets/banner.png assets/banner.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1113;
    --surface: #1C1E21;
    --surface-2: #23262A;
    --line: #383E46;
    --text: #F7F7F8;
    --muted: #A8A8A8;
    --lime: #D1FE17;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 420px; background: var(--bg); overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--text);
    position: relative;
    background:
      radial-gradient(520px 340px at 88% 40%, rgba(209,254,23,.10), transparent 70%),
      linear-gradient(var(--bg), var(--bg));
  }
  /* Retícula de visor muy sutil */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 45%, #000 100%);
  }
  .left { position: absolute; left: 72px; top: 64px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 44px; height: 44px; border-radius: 12px; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .eyebrow b { color: var(--text); font-weight: 500; }
  h1 {
    margin-top: 30px;
    font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 64px; line-height: .98; letter-spacing: -.035em;
  }
  h1 span { color: var(--lime); }
  .lede { margin-top: 18px; font-size: 17px; line-height: 1.5; color: var(--muted); max-width: 600px; white-space: nowrap; }
  .pipeline {
    position: absolute; left: 72px; bottom: 50px;
    display: flex; align-items: center; gap: 10px;
    font-family: "JetBrains Mono", monospace; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase;
  }
  .chip { padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); background: var(--surface); }
  .chip.on { border-color: var(--lime); color: var(--bg); background: var(--lime); }
  .arrow { width: 14px; height: 1px; background: var(--line); }

  /* Tira de tres fotogramas 9:16: blockout → borrador → final */
  .strip { position: absolute; right: 70px; top: 58px; display: flex; gap: 22px; align-items: flex-end; }
  .frame { width: 150px; height: 266px; border-radius: 14px; position: relative; overflow: hidden; }
  .frame .tag {
    position: absolute; left: 12px; top: 12px;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  }
  .frame .tc {
    position: absolute; right: 12px; bottom: 10px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; color: rgba(247,247,248,.45);
  }
  /* 1 · blockout: gris, cápsula a rayas, wireframe */
  .f1 { background: var(--surface); border: 1px solid var(--line); }
  .f1 .tag { color: var(--muted); }
  .f1 .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
    background: repeating-linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,.06) 18px 19px), linear-gradient(#2a2e33, #23262A); }
  .f1 .capsule { position: absolute; left: 56px; bottom: 58px; width: 38px; height: 120px; border-radius: 19px;
    background: repeating-linear-gradient(135deg, #3b4148 0 8px, #2b3036 8px 16px); }
  .f1 .box { position: absolute; left: 104px; bottom: 58px; width: 22px; height: 30px; background: #4a5058; border-radius: 3px; }
  /* 2 · borrador: silueta suave, todavía baja definición */
  .f2 { background: linear-gradient(160deg, #2a2e33, #15171a); border: 1px solid var(--line); }
  .f2 .tag { color: var(--text); }
  .f2 .light { position: absolute; inset: 0; background: radial-gradient(120px 160px at 70% 18%, rgba(247,247,248,.18), transparent 70%); }
  .f2 .figure { position: absolute; left: 44px; bottom: 0; width: 64px; height: 170px; filter: blur(3px); opacity: .85; }
  .f2 .figure::before { content: ""; position: absolute; left: 18px; top: 0; width: 28px; height: 34px; border-radius: 50%; background: #5a6068; }
  .f2 .figure::after { content: ""; position: absolute; left: 0; top: 36px; width: 64px; height: 140px; border-radius: 30px 30px 6px 6px; background: #4a5058; }
  /* 3 · final: el acento de marca, luz con cuerpo */
  .f3 { background: radial-gradient(150px 190px at 82% 30%, rgba(209,254,23,.38), transparent 70%), linear-gradient(170deg, #182008, #0F1113 72%);
    border: 1px solid var(--lime); box-shadow: 0 0 0 4px rgba(209,254,23,.08), 0 24px 60px -20px rgba(209,254,23,.35); }
  .f3 .tag { color: var(--lime); }
  .f3 .figure { position: absolute; left: 44px; bottom: 0; width: 64px; height: 178px; }
  .f3 .figure::before { content: ""; position: absolute; left: 18px; top: 0; width: 28px; height: 34px; border-radius: 50%;
    background: linear-gradient(120deg, #F7F7F8 0%, #8a9068 60%, #23262A 100%); }
  .f3 .figure::after { content: ""; position: absolute; left: 0; top: 36px; width: 64px; height: 146px; border-radius: 30px 30px 6px 6px;
    background: linear-gradient(110deg, #D1FE17 0%, #7a9410 38%, #1c2010 100%); }
  .f3 .corner { position: absolute; width: 14px; height: 14px; border-color: var(--lime); border-style: solid; opacity: .9; }
  .f3 .c1 { right: 10px; top: 10px; border-width: 2px 2px 0 0; }
  .f3 .c2 { left: 10px; bottom: 10px; border-width: 0 0 2px 2px; }
  .bust { position: absolute; left: 0; bottom: 0; width: 150px; height: 266px; }
  .f1 { height: 230px; opacity: .9; }
  .f2 { height: 248px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 1355 1355" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="1355" height="1355" rx="363" fill="#D1FE17"/>

      </svg>
      <div class="eyebrow">Skill independiente · <b>Higgsfield</b> + Claude Code</div>
    </div>
    <h1>Photorealistic<br><span>filmmaking</span></h1>
    <p class="lede">Dirección, continuidad y control de créditos para video con IA.</p>
  </div>

  <div class="pipeline">
    <span class="chip">Guion</span><i class="arrow"></i>
    <span class="chip">Blockout</span><i class="arrow"></i>
    <span class="chip">Referencias</span><i class="arrow"></i>
    <span class="chip">Borrador</span><i class="arrow"></i>
    <span class="chip on">Final</span>
  </div>

  <div class="strip">
    <div class="frame f1"><div class="floor"></div><div class="capsule"></div><div class="box"></div><span class="tag">01 Blockout</span><span class="tc">0 cr</span></div>
    <div class="frame f2"><div class="light"></div><svg class="bust" viewBox="0 0 150 266" aria-hidden="true"><defs><filter id="b2"><feGaussianBlur stdDeviation="3.2"/></filter></defs><g filter="url(#b2)" fill="#4a5058"><ellipse cx="75" cy="120" rx="25" ry="31"/><path d="M8 266 C 12 206, 44 186, 75 184 C 106 186, 138 206, 142 266 Z"/></g></svg><span class="tag">02 Borrador</span><span class="tc">480p</span></div>
    <div class="frame f3"><svg class="bust" viewBox="0 0 150 266" aria-hidden="true"><defs>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D1FE17" stop-opacity="0"/><stop offset=".62" stop-color="#D1FE17" stop-opacity="0"/><stop offset="1" stop-color="#D1FE17"/></linearGradient>
<linearGradient id="skin" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2b3316"/><stop offset=".45" stop-color="#14170f"/><stop offset="1" stop-color="#0b0c0d"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
<g fill="url(#skin)"><ellipse cx="75" cy="120" rx="25" ry="31"/><path d="M8 266 C 12 206, 44 186, 75 184 C 106 186, 138 206, 142 266 Z"/></g>
<g fill="none" stroke="url(#rim)" stroke-width="3" filter="url(#glow)"><ellipse cx="75" cy="120" rx="25" ry="31"/><path d="M75 184 C 106 186, 138 206, 142 266"/></g>
<g fill="none" stroke="url(#rim)" stroke-width="1.4"><ellipse cx="75" cy="120" rx="25" ry="31"/><path d="M75 184 C 106 186, 138 206, 142 266"/></g></svg><i class="corner c1"></i><i class="corner c2"></i><span class="tag">03 Final</span><span class="tc">9:16 · 24 fps</span></div>
  </div>
</body>
</html>
